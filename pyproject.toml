[project]
name = "forgesight"
version = "0.2.0"
description = "ForgeSight - document-layout CV inference workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

# Base: everything the API process needs. Deliberately free of torch and
# onnxruntime so the API image stays small and neither runtime is forced on
# the other pool. Design §7 puts the ORT worker in its own env with no torch.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
    "psutil>=6.0",
    "pycocotools>=2.0.8",
    "scipy>=1.14",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.45"]
ort = ["onnx>=1.16", "onnxruntime>=1.19"]
# Export uses torch.onnx.export with the TorchScript exporter. optimum-onnx is
# deliberately absent: Phase 0 (docs/adr/0001-phase0.md) measured that the
# dynamo exporter fails on RTDetrV2ForObjectDetection, and optimum-onnx's only
# viable path for these architectures is that exporter.
export = ["onnx>=1.16", "onnxscript>=0.7"]

# On Linux, PyPI's torch wheels are CUDA builds. That matters here for a specific
# reason rather than disk space: initialising a CUDA context reserves host memory
# that has nothing to do with the model, and this project's headline output is a
# per-runtime peak RSS figure. A CUDA torch in the torch worker would inflate
# exactly the number the system exists to measure, and the ONNX worker's number
# would remain honest -- so the comparison would be structurally unfair.
#
# The CPU wheels are only published on PyTorch's own index, so the resolution is
# pointed there for Linux. Markers keep macOS on PyPI, so local development on the
# M5 is unaffected, and `explicit = true` means no other package may use it.
#
# This lives here rather than in deploy/Dockerfile because it is a property of the
# dependency graph, and a Dockerfile hack would have to text-filter a
# hash-checked requirements file -- dropping nvidia-* and cuda-* entries along with
# torch, and duplicating the version pin. Here it is part of the lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgesight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "model: needs downloaded model weights (slow)",
    "integration: needs Postgres",
    "e2e: needs the full stack running",
    "slow: takes more than a second",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
