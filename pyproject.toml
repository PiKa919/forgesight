[project]
name = "forgesight"
version = "0.2.0"
description = "ForgeSight - document-layout CV inference workbench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }

# Base: everything the API process needs. Deliberately free of torch and
# onnxruntime so the API image stays small and neither runtime is forced on
# the other pool. Design §7 puts the ORT worker in its own env with no torch.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "numpy>=1.26",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "reportlab>=4.2",
    "psutil>=6.0",
    "pycocotools>=2.0.8",
    "scipy>=1.14",
    "httpx>=0.27",
    "huggingface-hub>=0.24",
]

[project.optional-dependencies]
torch = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.45"]
ort = ["onnx>=1.16", "onnxruntime>=1.19"]
# Export uses torch.onnx.export with the TorchScript exporter. optimum-onnx is
# deliberately absent: Phase 0 (docs/adr/0001-phase0.md) measured that the
# dynamo exporter fails on RTDetrV2ForObjectDetection, and optimum-onnx's only
# viable path for these architectures is that exporter.
export = ["onnx>=1.16", "onnxscript>=0.7"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgesight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "model: needs downloaded model weights (slow)",
    "integration: needs Postgres",
    "e2e: needs the full stack running",
    "slow: takes more than a second",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
