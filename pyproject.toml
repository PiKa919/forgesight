[project]
name = "forgesight"
version = "0.1.0"
description = "Document-layout CV inference workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "optimum-onnx>=0.1.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.19.0",
    "reportlab>=4.2.0",
    "pypdfium2>=4.30.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "psutil>=6.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "huggingface-hub>=0.24.0",
    "onnxscript>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
